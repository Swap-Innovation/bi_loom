services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
      POSTGRES_DB: migration_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - secrets/cursor.env
    environment:
      DATABASE_URL: postgresql+asyncpg://migration:migration@postgres:5432/migration_ai
      STORAGE_BACKEND: local
      STORAGE_PATH: /data/artifacts
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    volumes:
      - artifact_data:/data/artifacts
      - ./sample-data:/app/sample-data:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  artifact_data:
